<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Kanban Team Board</title>
    <!-- Tailwind CSS Standard Playback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        // If logged out signal is in the URL, purge local token
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('logout')) {
            localStorage.removeItem('kanban_token');
        } else {
            // Check if we have a saved token
            const token = localStorage.getItem('kanban_token');
            if (token && !urlParams.has('token') && !urlParams.has('error')) {
                const nextPath = urlParams.get('next') || '/';
                const connector = nextPath.includes('?') ? '&' : '?';
                window.location.href = nextPath + connector + "token=" + encodeURIComponent(token);
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl border border-slate-200/80 shadow-sm">
        
        <div>
            <!-- Clean Header Logo Icon -->
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            
            <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-slate-900">
                Kanban Team Board
            </h2>
            <p class="mt-2 text-center text-sm text-slate-500">
                Вход в систему управления задачами
            </p>
        </div>

        {% if error %}
        <div class="rounded-lg bg-rose-50 border border-rose-200 p-4 animate-fade-in" id="login-error">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 h-5 text-rose-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-rose-800">{{ error }}</h3>
                </div>
            </div>
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" action="/auth/login" method="POST">
            <input type="hidden" name="next" value="{{ next_url or '/' }}">
            <div class="space-y-4 rounded-md">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Имя пользователя (Логин)</label>
                    <input id="username" name="username" type="text" autocomplete="username" required 
                        placeholder="Например: admin" value="{{ username or '' }}"
                        class="block w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm">
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-slate-700">Пароль</label>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required 
                        placeholder="••••••••"
                        class="block w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm">
                </div>
            </div>

            <div>
                <button type="submit" 
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-150 cursor-pointer shadow-sm shadow-indigo-100">
                    Войти
                </button>
            </div>
        </form>
        
        <div class="mt-6 border-t border-slate-100 pt-6 text-center">
            <p class="text-xs text-slate-400 leading-relaxed">
                Доступные аккаунты по умолчанию:<br>
                <span class="font-mono text-[10px] bg-slate-100 text-slate-600 px-1 py-0.5 rounded">admin / admin</span> • 
                <span class="font-mono text-[10px] bg-slate-100 text-slate-600 px-1 py-0.5 rounded">pavel / pavel</span> • 
                <span class="font-mono text-[10px] bg-slate-100 text-slate-600 px-1 py-0.5 rounded">elena / elena</span>
            </p>
        </div>

    </div>
</body>
</html>
